name: hosts

# AI-host packaging and installation. Kept apart from acceptance.yml (the engine on each operating system):
#   installer        install.py and the packages on Linux, Windows and macOS (operating-system results)
#   host-discovery   the real Codex, Gemini CLI, Copilot and OpenCode CLIs list the installed skill (host results)
#   packages         builds every download; attaches them to a published release
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: generated host docs are current
        run: python install.py docs --check
      - name: installer and package tests
        run: python -m unittest discover -s hosts/tests -v

  host-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install the host CLIs (runner's preinstalled Node; no sign-in needed for discovery)
        run: npm install -g @openai/codex @google/gemini-cli opencode-ai @github/copilot
      - name: hosts list the installed skill (local builds, and straight from GitHub at this commit's branch)
        env:
          DESIGN_DNA_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: >
          python hosts/tests/host_discovery.py --hosts codex,gemini-cli,copilot,opencode --out host-discovery.json
          --github-ref "${{ github.head_ref || github.ref_name }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: host-discovery
          path: host-discovery.json

  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python install.py package --target all --out dist/packages
      - uses: actions/upload-artifact@v7
        with:
          name: design-dna-packages
          path: dist/packages/
      - name: attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/packages/* --clobber
