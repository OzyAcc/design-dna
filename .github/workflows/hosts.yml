name: hosts

# AI-host packaging and installation. Kept apart from acceptance.yml (the engine on each operating system):
#   installer        install.py and the packages on Linux, Windows and macOS (operating-system results)
#   host-discovery   the real Codex, Gemini CLI, Copilot and OpenCode CLIs list the installed skill (host results)
#   packages         builds every download; a pushed version tag (v2.1.0) publishes the release with all of them
#                    attached, a release published by hand gets them attached, and both check every link downloads
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: generated host docs are current
        run: python install.py docs --check
      - name: installer and package tests
        run: python -m unittest discover -s hosts/tests -v

  host-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install the host CLIs (runner's preinstalled Node; no sign-in needed for discovery)
        run: npm install -g @openai/codex @google/gemini-cli opencode-ai @github/copilot
      - name: hosts list the installed skill (local builds, and straight from GitHub at this commit's branch)
        env:
          DESIGN_DNA_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: >
          python hosts/tests/host_discovery.py --hosts codex,gemini-cli,copilot,opencode --out host-discovery.json
          --github-ref "${{ github.head_ref || github.ref_name }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: host-discovery
          path: host-discovery.json

  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python install.py package --target all --out dist/packages
      - uses: actions/upload-artifact@v7
        with:
          name: design-dna-packages
          path: dist/packages/
      - name: publish the release (version tag pushed)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          test "$(cat VERSION)" = "$ver" || { echo "VERSION says $(cat VERSION), the tag says $ver"; exit 1; }
          # the release notes are this version's CHANGELOG section; a tag without one is refused
          awk -v h="## [$ver]" 'index($0, h) == 1 {p = 1; next} /^## \[/ {p = 0} p' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for $ver"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "Design DNA $ver" --notes-file release-notes.md
          gh release upload "$TAG" dist/packages/* --clobber
      - name: attach to the release (published by hand)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/packages/* --clobber
      - name: every download link works
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          for f in dist/packages/*; do
            n=$(basename "$f")
            curl -fsSL --retry 3 -o "got-$n" "https://github.com/${{ github.repository }}/releases/download/$TAG/$n"
            cmp "$f" "got-$n"
          done
          echo "all $(ls dist/packages | wc -l) files download from $TAG and match the build"
