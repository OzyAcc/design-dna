name: acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyflakes jsonschema
      - name: pyflakes
        run: python -m pyflakes skills/reverse-design/scripts skills/reverse-design/tests
      - name: schemas are valid JSON Schema 2020-12
        run: |
          python - <<'EOF'
          import json, pathlib, jsonschema
          for p in pathlib.Path("skills/reverse-design/schemas").glob("*.json"):
              jsonschema.Draft202012Validator.check_schema(json.loads(p.read_text()))
              print("ok", p.name)
          EOF

  acceptance:
    # The suite uses Windows system fonts (Arial, Georgia, ...) and the preinstalled Chrome.
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      DESIGN_DNA_ACCEPTANCE_DIR: ${{ github.workspace }}\acceptance-out
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: capability report
        run: python skills/reverse-design/scripts/capabilities.py
      - name: acceptance suite (22 demonstrations + 10 audit regressions)
        run: python skills/reverse-design/tests/run_acceptance.py
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-evidence
          path: acceptance-out/
          retention-days: 14
